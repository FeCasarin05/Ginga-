<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>if(localStorage.getItem('ginga_theme')==='dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GINGA! – Aplicativo da comunidade de quadrilha junina. Comece agora ou entre na comunidade." />
  <title>GINGA! – Tela Inicial</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=639170776855048597" />
  <link rel="stylesheet" href="responsive-desktop.css" />
</head>
<body>

  <div class="shell" role="main">
    <div class="screen">

      <!-- ===== HERO MOBILE: imagem vertical PNG (só aparece no mobile) ===== -->
      <section
        class="hero hero-mobile"
        aria-label="Logo GINGA! com tambor junino"
        style="background-image: url('IMG/Captura de tela 2026-05-02 151926.png');"
      >
        <div class="hero-overlay" aria-hidden="true"></div>
      </section>

      <!-- ===== HERO DESKTOP: SVG 16:9 cobre a tela inteira (só aparece no desktop) ===== -->
      <section class="hero hero-desktop" aria-label="Logo GINGA! com tambor junino">
        <img
          src="SVG/SPLASH SCREEN RESPONSIVO.svg"
          alt="GINGA! – Splash Screen com tambor junino"
          class="splash-svg"
        />
        <!-- Botões sobrepostos no canto inferior central -->
        <div class="splash-actions-overlay">
          <a
            href="criar-conta.html"
            id="btn-comecar-desktop"
            class="btn btn-primary"
            role="button"
            aria-label="Começar agora — acessar o aplicativo GINGA!"
          >
            <span class="btn-label">COMEÇAR AGORA</span>
            <span class="btn-icon" aria-hidden="true">→</span>
          </a>

          <a
            href="login.html"
            id="btn-comunidade-desktop"
            class="btn btn-secondary btn-secondary-light"
            role="button"
            aria-label="Já sou da comunidade — entrar com minha conta"
          >
            JÁ SOU DA COMUNIDADE
          </a>
        </div>
      </section>

      <!-- ===== ACTIONS MOBILE: painel escuro com botões (só aparece no mobile) ===== -->
      <section class="actions actions-mobile" aria-label="Ações principais do aplicativo">

        <a
          href="criar-conta.html"
          id="btn-comecar"
          class="btn btn-primary"
          role="button"
          aria-label="Começar agora — acessar o aplicativo GINGA!"
        >
          <span class="btn-label">COMEÇAR AGORA</span>
          <span class="btn-icon" aria-hidden="true">→</span>
        </a>

        <a
          href="login.html"
          id="btn-comunidade"
          class="btn btn-secondary"
          role="button"
          aria-label="Já sou da comunidade — entrar com minha conta"
        >
          JÁ SOU DA COMUNIDADE
        </a>

      </section>

    </div><!-- /.screen -->
  </div><!-- /.shell -->

  <script src="app.js"></script>
</body>
</html>
